services:


  postgres:
    image: postgres:16-alpine
    container_name: user-service-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"  # ← исправлено: внутри контейнера всегда 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prodman-network






  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"  # ← исправлено: внутри контейнера всегда 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prodman-network

  user-service:
    build: .
    container_name: user-service-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8081"  # ← внутри контейнера всегда 8081
    environment:
      # Для подключения к БД внутри Docker сети — имена контейнеров!
      POSTGRES_HOST: postgres  # ← зашито, не из .env
      POSTGRES_PORT: 5432      # ← зашито, не из .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Redis внутри Docker сети
      REDIS_HOST: redis        # ← зашито, не из .env
      REDIS_PORT: 6379         # ← зашито, не из .env
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # Server
      SERVER_PORT: 8081        # ← зашито
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prodman-network

volumes:
  postgres_data:
    name: user-service-postgres-data
  redis_data:
    name: user-service-redis-data

networks:
  prodman-network:
    driver: bridge