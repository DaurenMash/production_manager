spring:
  application:
    name: test-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://test-postgres:5432/prodman_tests}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
#    contexts: docker    # нет других контекстов. Запуск только через докер

server:
  port: ${SERVER_PORT:8085}

debug: true

logging:
  level:
    com.prodman.test: DEBUG
    org.springframework.web: DEBUG
    liquibase: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.boot.autoconfigure.liquibase: TRACE
    org.springframework.boot.context.properties: DEBUG
    org.springframework.context: DEBUG
    org.springframework.context.annotation: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always