spring:
  application:
    name: workstation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://workstation-postgres:5432/prodman_workstations}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT:8083}

logging:
  level:
    com.prodman.workstation: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    liquibase: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: workstation
    distribution:
      percentiles-histogram:
        [http.server.requests]: true
      slo:
        [http.server.requests]: 100ms, 500ms, 1s, 2s, 5s
  prometheus:
    metrics:
      export:
        enabled: true