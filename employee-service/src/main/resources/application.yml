spring:
  application:
    name: employee-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://employee-postgres:5432/prodman_employees}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: true

server:
  port: ${SERVER_PORT:8084}

logging:
  level:
    com.prodman.employee: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    liquibase: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always