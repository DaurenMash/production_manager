# Global settings
global:
  namespace: prodman
  imagePullPolicy: IfNotPresent
  imageRegistry: localhost:5000
  env: docker

# Namespace
namespace:
  name: prodman

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: prodman.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 8080

# PostgreSQL
postgresql:
  enabled: true
  image: postgres:16-alpine
  replicas: 1
  port: 5432
  database: prodman
  username: postgres
  password: postgres
  storage:
    size: 10Gi
    className: standard
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# User Service
userService:
  enabled: true
  image: user-service:latest
  replicas: 2
  minReplicas: 2
  maxReplicas: 3
  port: 8081
  targetPort: 8081
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    SPRING_PROFILES_ACTIVE: docker
    SERVER_PORT: "8081"
  # ИСПРАВЛЕНО: увеличены задержки для медленного старта приложения
  livenessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 300  # было 120
    periodSeconds: 10
    failureThreshold: 5       # добавлено
  readinessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 240  # было 60
    periodSeconds: 10         # было 5
    failureThreshold: 3       # добавлено
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# API Gateway
apiGateway:
  enabled: true
  image: api-gateway:latest
  replicas: 2
  minReplicas: 2
  maxReplicas: 3
  port: 8080
  targetPort: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    SPRING_PROFILES_ACTIVE: docker
    SERVER_PORT: "8080"
  # ИСПРАВЛЕНО: увеличены задержки для медленного старта приложения
  livenessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 300  # было 120
    periodSeconds: 10
    failureThreshold: 5       # добавлено
  readinessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 240  # было 60
    periodSeconds: 10         # было 5
    failureThreshold: 3       # добавлено
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# Work Calendar
workCalendar:
  enabled: true
  image: work-calendar:latest
  replicas: 2
  minReplicas: 2
  maxReplicas: 3
  port: 8086
  targetPort: 8086
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    SPRING_PROFILES_ACTIVE: docker
    SERVER_PORT: "8086"
  # ИСПРАВЛЕНО: увеличены задержки для медленного старта приложения
  livenessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 300  # было 120
    periodSeconds: 10
    failureThreshold: 5       # добавлено
  readinessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 240  # было 60
    periodSeconds: 10         # было 5
    failureThreshold: 3       # добавлено
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# Redis
redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# MongoDB
mongodb:
  enabled: true
  image: mongo:7.0
  username: admin
  password: password
  database: prodman_logs
  storage:
    size: 5Gi
  persistence:
    enabled: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Equipment Monitor (опционально)
equipmentMonitor:
  enabled: false
  image: equipment-monitor:latest
  replicas: 2
  port: 8082

# Schedule Service (опционально)
scheduleService:
  enabled: false
  image: schedule-service:latest
  replicas: 2
  port: 8084