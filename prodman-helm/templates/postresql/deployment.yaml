{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.namespace.name }}
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | default "postgres:16-alpine" }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.postgresql.port | default 5432 }}
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | default "prodman" }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | default "postgres" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prodman-secrets
                  key: postgres-password
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: postgresql
  ports:
    - port: {{ .Values.postgresql.port | default 5432 }}
      targetPort: {{ .Values.postgresql.port | default 5432 }}
      name: postgres
  type: ClusterIP
{{- end }}