{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app: api-gateway
    {{- include "prodman.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.global.imageRegistry }}/{{ .Values.apiGateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.targetPort }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.apiGateway.env.SPRING_PROFILES_ACTIVE }}
            - name: SERVER_PORT
              value: {{ .Values.apiGateway.env.SERVER_PORT | quote }}
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: WORK_CALENDAR_URL
              value: "http://work-calendar:8086"
            - name: SPRING_DATA_MONGODB_HOST
              value: "mongodb"
            - name: SPRING_DATA_MONGODB_PORT
              value: "27017"
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "prodman_logs"
            - name: SPRING_DATA_MONGODB_USERNAME
              value: "admin"
            - name: SPRING_DATA_MONGODB_PASSWORD
              value: "password"
            - name: SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE
              value: "admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: prodman-secrets
                  key: jwt-secret
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          {{- if .Values.apiGateway.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.apiGateway.livenessProbe.path }}
              port: {{ .Values.apiGateway.targetPort }}
            initialDelaySeconds: {{ .Values.apiGateway.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.apiGateway.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.apiGateway.readinessProbe.path }}
              port: {{ .Values.apiGateway.targetPort }}
            initialDelaySeconds: {{ .Values.apiGateway.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.readinessProbe.periodSeconds }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.targetPort }}
      name: http
  type: ClusterIP
---
{{- if .Values.apiGateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: {{ .Values.namespace.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: {{ .Values.apiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}